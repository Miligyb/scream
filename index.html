<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shop</title>
    <style>
        /* Сброс стилей и настройка фона */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f0f2f5; /* Светло-серый фон */
            font-family: -apple-system, BlinkMacSystemFont, "San Francisco", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Стили модального окна */
        .cookie-modal {
            background-color: #ffffff;
            width: 90%;
            max-width: 400px;
            padding: 32px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            z-index: 2;
            position: relative;
        }

        .cookie-modal h2 {
            margin: 0 0 16px 0;
            font-size: 1.2rem;
            color: #000000;
            font-weight: bold;
        }

        .cookie-modal p {
            font-size: 0.95rem;
            color: #666666;
            line-height: 1.5;
            margin: 0 0 24px 0;
        }

        /* Контейнер для кнопок */
        .buttons-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* Общие стили кнопок */
        button {
            flex: 1;
            padding: 12px 0;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.85;
        }

        /* Кнопка Accept */
        .btn-accept {
            background-color: #7b2cbf; /* Фиолетовый цвет */
            color: #ffffff;
            border: none;
        }

        /* Кнопка Decline */
        .btn-decline {
            background-color: #ffffff;
            color: #7b2cbf;
            border: 1px solid #7b2cbf;
        }

        /* Ссылка Privacy policy */
        .privacy-link {
            color: #999999;
            font-size: 0.85rem;
            text-decoration: underline;
            cursor: pointer;
        }

        /* Стили скрытого видео */
        #scare-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Изначально скрыто */
            z-index: 10;
            background-color: #000000;
        }
    </style>
</head>
<body>

    <video id="scare-video" loop playsinline muted>
        <source src="video.mp4" type="video/mp4">
    </video>

    <div class="cookie-modal" id="modal">
        <h2>Cookies and user-generated content</h2>
        <p>This website uses cookies to offer you the most relevant information and better understand how you use this website. Please accept cookies for optimal performance.</p>
        
        <div class="buttons-container">
            <button class="btn-decline" onclick="triggerAction()">Decline</button>
            <button class="btn-accept" onclick="triggerAction()">Accept</button>
        </div>
        
        <a class="privacy-link">Privacy policy</a>
    </div>

    <script>
        function triggerAction() {
            const modal = document.getElementById('modal');
            const video = document.getElementById('scare-video');

            // 1. Резко скрываем модальное окно
            modal.style.display = 'none';

            // 2. Делаем видео видимым
            video.style.display = 'block';

            // 3. Запрашиваем полноэкранный режим
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => console.log(err));
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen().catch(err => console.log(err));
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen().catch(err => console.log(err));
            }

            // 4. Снимаем мут (так как был клик пользователя, звук разрешен) и запускаем
            video.muted = false;
            
            video.play().catch(error => {
                console.warn("Автоплей со звуком заблокирован, пробуем запустить без звука:", error);
                // Фолбек: если браузер всё-таки заблокировал звук, запускаем видео немым
                video.muted = true;
                video.play();
            });
        }
    </script>

</body>
</html>
